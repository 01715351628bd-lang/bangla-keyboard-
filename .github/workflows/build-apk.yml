name: Build Kotha Pro Bangla Keyboard APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          if [ -d "android" ]; then
            cd android
          fi
          chmod +x gradlew

      - name: Run Unit Tests
        run: |
          if [ -d "android" ]; then
            cd android
          fi
          ./gradlew --no-daemon testDebugUnitTest

      - name: Build Android Debug APK
        run: |
          if [ -d "android" ]; then
            cd android
          fi
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK Generation
        run: |
          APK_PATH=$(find . -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Debug APK file was not produced!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kotha-pro-bangla-keyboard-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Test Reports (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/**
          retention-days: 7
